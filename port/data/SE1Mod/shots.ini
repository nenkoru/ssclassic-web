// Visual regression capture: replay a demo at a fixed time step (1/20 s of demo time per frame,
// independent of wall-clock), so frame contents are identical run to run.
// Start with ?shots=<label> (see tools/bench.mjs --shots, tools/shotdiff.py).
sam_bAutoPlayDemos = 0;
hud_bShowClock = 0;          // wall-clock time on the HUD is not deterministic
sam_iVideoSetup = 3;         // "custom": don't let the GLSettings preset scripts override what follows
gfx_iLensFlareQuality = 0;   // flares fade on wall-clock time: frames would depend on build speed
dem_fSyncRate = 20;
PlayDemo("Auto-Demo0001");
