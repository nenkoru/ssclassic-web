# Serious Sam: The First Encounter as an Archipelago game: the item and location tables.
# One source of truth for both sides: the APWorld (archipelago/serioussam_tfe/__init__.py) reads it
# with tomllib, and the Rust mod (rust/se1-mod/src/archipelago.rs) embeds it with include_str!.
# Design: notes/archipelago.md. IDs never change once published (save files and servers keep them).
#
# items:     id = 5330000 + WeaponItemType (WeaponItem.es); `wit` is what host.give_weapon takes,
#            `weapon` the WeaponType (PlayerWeapons.es) whose bit 1 << (weapon - 1) is in weapons_owned.
# locations: id = 5340000 + level * 1000 + n. `world` is the file se1mod_level_started reports,
#            `entity` the pickup's entity id in that world file (host.pickups; tools/apscan.mjs).

